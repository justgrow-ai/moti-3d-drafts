<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orb 캐릭터 시안 · three.js</title>
<style>
:root{--bg:#f3f3f1;--ink:#0a0a0a;--sub:#8a8a8a;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Pretendard","Noto Sans KR",sans-serif}
header{padding:40px 48px 8px;display:flex;align-items:end;gap:24px;flex-wrap:wrap}
h1{font-size:28px;margin:0;letter-spacing:-.02em}header p{margin:0;color:var(--sub);font-size:14px}
.tabs{margin-left:auto;display:flex;gap:6px;background:#e7e7e4;padding:4px;border-radius:999px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;color:#555}
.tabs button.on{background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:24px 48px 56px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:22px;overflow:hidden;text-decoration:none;color:inherit;display:block;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.card .vis{aspect-ratio:1;position:relative;background:#ddd}
.card .vis img,.card .vis iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.card .meta{padding:14px 16px 16px}.card b{font-size:14px}.card small{display:block;color:var(--sub);font-size:12px;margin-top:4px;line-height:1.45}
.live{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
@media(max-width:720px){header{padding:calc(env(safe-area-inset-top) + 24px) 16px 4px}h1{font-size:22px}.tabs{margin-left:0}.live{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px 40px}.card{border-radius:18px}.card small{display:none}.card .meta{padding:10px 12px 12px}.card b{font-size:13px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<header><div><h1>Orb 캐릭터 시안</h1><p>눈만 있는 구체·슬라임 10종 + 팔 달린 버전 10종 · 눌러서 단독 화면에서 만져보세요 · 좌우 스와이프로 A/B 전환</p></div>
<label class="live"><input type="checkbox" id="live"> 라이브 3D로 비교</label>
<div class="tabs"><button data-s="A" class="on">A · 눈만</button><button data-s="B">B · 팔</button></div></header>
<div class="grid" id="g"></div>
<script type="module">
import { A, B } from './src/variants.js';
let set='A';
function render(){ const L=document.getElementById('live').checked; const list=set==='A'?A:B;
 g.innerHTML=list.map(v=>`<a class="card" href="view.html?v=${v.id}"><div class="vis">${L?`<iframe loading="lazy" src="view.html?v=${v.id}&ui=0"></iframe>`:`<img src="shots/${v.id}.png" alt="">`}</div><div class="meta"><b>${v.id} · ${v.name}</b><small>${v.desc}</small></div></a>`).join(''); }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); set=b.dataset.s; render();});
document.getElementById('live').onchange=render; render();
// mobile: swipe left/right on the gallery to flip between A and B
let sx=0,sy=0,st=0; addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy; if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-st<700){ const want=dx<0?'B':'A'; if(want!==set) document.querySelector(`.tabs button[data-s="${want}"]`).click(); }},{passive:true});
</script></body></html>
