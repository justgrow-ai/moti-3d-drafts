function fx2Pose(def){ const a=FX2_ZERO.slice(); if (!def) return a;
  for (let s=0;s<2;s++){ const e=Array.isArray(def.e)?def.e[s]:def.e, b=Array.isArray(def.b)?def.b[s]:def.b, o=s*FX2N;
    if (e) for (const k in e){ const i=FX2K.indexOf(k); if (i>=0 && i<8) a[o+i]=e[k]; }
    if (b) for (const k in b){ const i={y:8,tilt:9,bend:10,pull:11,x:12}[k]; if (i!==undefined) a[o+i]=b[k]; } }
  const B=def.body||{}; if (B.sy!==undefined) a[26]=B.sy; a[27]=B.hop||0; a[28]=B.rz||0; a[29]=B.rx||0; return a; }

function fx2R(){ const sd=Math.random()*200, E={};

    ev(k,t,a,b,w){ let e=E[k]; if (!e) e=E[k]={at:t+rnd(a,b)*rnd(0.3,0.8),amp:rnd(0.7,1.3)}; while (t>e.at+w*3){ e.at+=rnd(a,b); e.amp=rnd(0.7,1.3); } return e.amp*Math.exp(-Math.pow((t-e.at)/w,2)); } }; }

function swRow(det,f){ const r=rowEl(f.k,f.tip); r.style.flexWrap='wrap'; const gd=document.createElement('div'); gd.className='swG'; gd.style.cssText='display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:6px';
  const L=f.sw==='bg'?BG_SW:CHAR_SW, bs=[];
  L.forEach(([nm,h],i)=>{ const last=i===L.length-1; const b=document.createElement(last?'label':'button'); b.title=nm; b.setAttribute('aria-label',nm);
    b.style.cssText='width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.12);padding:0;cursor:pointer;position:relative;flex:0 0 auto;box-sizing:border-box;overflow:hidden';
    if (last){ b.style.background='conic-gradient(#e8786a,#f2c75c,#a9c39f,#8fd2be,#90c3e8,#4f79a8,#e8786a)'; const c=document.createElement('input'); c.type='color'; c.style.cssText='position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer';
      c.addEventListener('input',()=>{ S[f.ck]=fromHex(c.value); S[f.k]=i; save(); upd(); }); b.appendChild(c); b._c=c; }
    else { b.style.background=f.sw==='bg'?bgCss(hx(h),i===0):h; b.onclick=()=>{ S[f.k]=i; save(); upd(); }; }
    gd.appendChild(b); bs.push(b); });
  const upd=()=>{ const v=S[f.k]|0; bs.forEach((b,i)=>{ b.style.outline=i===v?'2.5px solid #1a1a1a':'none'; b.style.outlineOffset='2px'; }); const lb=bs[bs.length-1]; if (S[f.ck]){ lb._c.value=toHex(S[f.ck]); if (v===bs.length-1) lb.style.background=toHex(S[f.ck]); else lb.style.background='conic-gradient(#e8786a,#f2c75c,#a9c39f,#8fd2be,#90c3e8,#4f79a8,#e8786a)'; } };
  r.appendChild(gd); det.appendChild(r); refreshers.push(upd); upd(); }
